mode server
proto udp
port 123
verb 3
user nobody
group nogroup

dev tun
persist-tun
tun-mtu 1400
mssfix
mtu-disc no

tls-server
tls-version-min 1.3
tls-cert-profile preferred
auth SHA384
data-ciphers AES-256-GCM:CHACHA20-POLY1305
tls-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
allow-compression no
remote-cert-tls client
verify-client-cert require

float
duplicate-cn
keepalive 10 30
explicit-exit-notify 1

dh none
ca ca.crt
cert public.crt
key private.key
tls-crypt tls-crypt-<HOSTNAME>.key

topology subnet
server 10.77.100.0 255.255.255.0

push "dhcp-option DNS 8.8.8.8"
push "dhcp-option DNS 8.8.4.4"
push "dhcp-option DNS 1.1.1.1"
push "dhcp-option DNS 1.0.0.1"

push "route 8.8.8.8 255.255.255.255"
push "route 8.8.4.4 255.255.255.255"
push "route 1.1.1.1 255.255.255.255"
push "route 1.0.0.1 255.255.255.255"

push "dhcp-option DOMAIN ."
push "dhcp-option DOMAIN-ROUTE ."

push "redirect-gateway def1 ipv6 block-local"

push "explicit-exit-notify 1"
